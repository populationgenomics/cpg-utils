name: Package
on:
  push:
    branches:
      - main

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e #v10.3.2
        with:
          enable-cache: false
          version: 0.13.6 #uv version

      - name: Build
        run: uv build --out-dir dist

      - name: Smoke test package
        run: |
          for dist in dist/*; do
            echo "Testing package dist $dist"
            uv run \
              --with "$dist" \
              --no-project \
              --isolated \
              -- python -I -c "import cpg_utils.cloud"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*
          retention-days: 2

  upload_pypi:
    needs: package
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish the wheel to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
