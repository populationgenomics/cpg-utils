name: Package
on:
  push:
    branches:
      - main

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e #v6.8.0
        with:
          activate-environment: true
          enable-cache: false
          version: 0.8.22 #uv version

      - name: Setup build env
        run: uv sync

      - name: Install prerequisites
        run: pip install --upgrade build

      - name: Build
        run: |
          uv build --sdist --out-dir dist

      - name: Smoke test package
        run: |
          for tarball in packages/cpg-utils/dist/*.tar.gz; do
            echo "Testing package dist $tarball"
            uv run \
              --with "$tarball" \
              --no-project \
              --isolated \
              -- python -c "import cpg_utils.cloud"
          done

      - name: Publish package
        if: github.ref == 'refs/heads/main'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/cpg-utils/dist
          skip-existing: true

  upload_pypi:
    needs: package
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish the wheel to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
