name: Test
on: [push]

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -eo pipefail -l {0}

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e #v10.3.2
      with:
        activate-environment: true
        enable-cache: false
        version: 0.13.6 #uv version

    - name: Install packages
      run: uv sync

    - name: "Run unit tests"
      id: runtests
      run: |
        rc=0
        uv run coverage run -m pytest --junitxml=test-execution.xml || rc=$?
        uv run coverage xml

        echo "rc=$rc" >> $GITHUB_OUTPUT

    - name: 'Save coverage report as an Artifact'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./coverage.xml

    - name: 'Save execution report as an Artifact'
      uses: actions/upload-artifact@v4
      with:
        name: execution-report
        path: ./test-execution.xml

    - name: Fail if tests are not passing
      if: ${{ steps.runtests.outputs.rc != 0 }}
      uses: actions/github-script@v6
      env:
        rc: ${{ steps.runtests.outputs.rc }}
      with:
        script: |
          core.setFailed(`Unit tests failed with rc = ${process.env.rc}`)
